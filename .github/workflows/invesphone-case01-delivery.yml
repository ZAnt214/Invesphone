name: Invesphone Case01 Final Evidence Delivery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/invesphone-case01-delivery.yml"

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download final asset package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://0ee20d7c-cdee-4f85-b069-1bec0357716b.sandbox.floot.app/_cdn/static/4f84f084-b446-41ec-b26f-a59e7bf5c475-invesphone_case01_final_assets.zip" \
            -o /tmp/invesphone_case01_final_assets.zip
          rm -rf public/evidence/case01/final
          mkdir -p public/evidence/case01/final
          unzip -q /tmp/invesphone_case01_final_assets.zip -d public/evidence/case01/final

      - name: Validate 24 final PNGs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path("public/evidence/case01/final")
          expected_scene = {
              "comodos/comodo_01_entrada.png",
              "comodos/comodo_02_sala.png",
              "comodos/comodo_03_cozinha.png",
              "comodos/comodo_04_escritorio.png",
              "comodos/comodo_05_corredor.png",
              "comodos/comodo_06_quarto_casal.png",
              "comodos/comodo_07_quarto_livia.png",
              "comodos/comodo_08_canil.png",
              "comodos/comodo_09_painel_alarme.png",
              "fechadura_porta.png",
              "trava_canil.png",
              "escritorio_comparativo.png",
              "foto_fachada_lan.png",
              "croqui_residencia.png",
              "croqui_rua.png",
          }
          expected_docs = {
              "laudo_preliminar_local.png",
              "ficha_veiculo_gol.png",
              "quadro_horarios.png",
              "matricula_imovel.png",
              "consulta_antecedentes.png",
              "termo_declaracao_terceiro_cida.png",
              "termo_apreensao_celular_helena.png",
              "capa_inquerito.png",
              "termo_depoimento_modelo.png",
          }
          expected = expected_scene | expected_docs
          actual = {str(p.relative_to(root)) for p in root.rglob("*.png")}
          assert actual == expected, f"PNG set mismatch. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}"
          assert len(actual) == 24

          def png_size(path: Path):
              with path.open("rb") as f:
                  sig = f.read(24)
              assert sig[:8] == b"\x89PNG\r\n\x1a\n", f"Not PNG: {path}"
              return struct.unpack(">II", sig[16:24])

          for rel in expected_scene:
              assert png_size(root / rel) == (2400, 1800), (rel, png_size(root / rel))
          for rel in expected_docs:
              assert png_size(root / rel) == (2025, 2880), (rel, png_size(root / rel))

          print("Validated 24 PNGs and dimensions.")
          PY

      - name: Move fulfilled request to completed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p creative-requests/completed
          if [ -f creative-requests/inbox/2026-10-03-equipe-material-final-ilustrado.md ]; then
            git mv creative-requests/inbox/2026-10-03-equipe-material-final-ilustrado.md \
              creative-requests/completed/2026-10-03-equipe-material-final-ilustrado.md
          fi

      - name: Commit final assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add public/evidence/case01/final creative-requests/completed creative-requests/inbox
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "feat(case01): add final illustrated evidence pack"
          git push origin HEAD:main
