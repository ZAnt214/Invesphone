name: Materialize Case 01 evidence assets

on:
  push:
    paths:
      - "creative-requests/payloads/case01-new-svg/termo_depoimento_modelo.svg"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install SVG renderers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
      - name: Render final JPG and PNG evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC="creative-requests/payloads/case01-new-svg"
          DST="public/evidence/case01/new"
          test "$(find "$SRC" -maxdepth 1 -name '*.svg' -type f | wc -l)" -eq 15
          rm -rf "$DST"
          mkdir -p "$DST" /tmp/case01-render

          for name in croqui_residencia fechadura_porta trava_canil escritorio_comparativo croqui_rua foto_fachada_lan; do
            rsvg-convert -w 1600 -h 1200 "$SRC/$name.svg" -o "/tmp/case01-render/$name.png"
            convert "/tmp/case01-render/$name.png" -strip -quality 88 "$DST/$name.jpg"
          done

          for name in laudo_preliminar_local ficha_veiculo_gol quadro_horarios matricula_imovel consulta_antecedentes termo_declaracao_terceiro_cida termo_apreensao_celular_helena capa_inquerito termo_depoimento_modelo; do
            rsvg-convert -w 900 -h 1280 "$SRC/$name.svg" -o "$DST/$name.png"
            convert "$DST/$name.png" -strip "$DST/$name.png"
          done

          test "$(find "$DST" -maxdepth 1 -type f | wc -l)" -eq 15
          test "$(find "$DST" -maxdepth 1 -name '*.jpg' -type f | wc -l)" -eq 6
          test "$(find "$DST" -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 9
      - name: Mark Claude request complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("creative-requests/inbox/2026-10-02-equipe-material-novo.md")
          text = p.read_text(encoding="utf-8")
          text = text.replace("status: pending", "status: completed", 1)
          marker = "## Resposta do ChatGPT"
          if marker in text:
              text = text.split(marker)[0].rstrip() + "\n\n" + marker + "\n\n"
          text += """- status: completed
- assets criados: 15/15 em `public/evidence/case01/new/`
- observações: materiais novos criados no universo visual do pacote existente, com leitura limpa no iPhone e estética de evidência de 2002. Dados não definidos pelo cânone ficaram como \"A APURAR\". Nenhuma das três propostas que alteram a lógica das provas foi criada. Claude pode agora registrar os novos gatilhos/conversas em `src/App.tsx`, `manifest.json` e `src/evidence/case01Materials.ts`.
"""
          p.write_text(text, encoding="utf-8")
          PY
      - name: Commit final assets and clean temporary transfer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf creative-requests/payloads/case01-new-svg
          rm -f creative-requests/payloads/case01_new_assets.ready
          rm -f .github/workflows/materialize-case01-assets.yml
          git config user.name "ChatGPT Evidence Bot"
          git config user.email "chatgpt-evidence-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add 15 new Case 01 evidence assets for Claude"
          git push origin HEAD:main
