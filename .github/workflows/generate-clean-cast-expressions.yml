name: Generate seamless cast expressions

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-clean-cast-expressions.py"
      - ".github/workflows/generate-clean-cast-expressions.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless

      - name: Generate assets
        run: python scripts/generate-clean-cast-expressions.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/characters/*/expressions/uncomfortable.jpg
          git add public/characters/*/expressions/lying.jpg
          git add creative-requests/inbox creative-requests/completed
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate seamless uncomfortable and lying expressions"
          git push
