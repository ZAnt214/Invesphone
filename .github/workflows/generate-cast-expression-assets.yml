name: Generate Case 01 cast expression assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-cast-expression-assets.py'
      - '.github/workflows/generate-cast-expression-assets.yml'
      - 'public/characters/caio/portrait.jpg'
      - 'public/characters/teo/portrait.jpg'
      - 'public/characters/rafael/portrait.jpg'
      - 'public/characters/cida/portrait.jpg'
      - 'public/characters/jorge/portrait.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate expression packs and visemes
        run: python scripts/generate-cast-expression-assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "invesphone-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             public/characters/caio             public/characters/teo             public/characters/rafael             public/characters/cida             public/characters/jorge             public/characters/manifest.json             creative-requests/inbox             creative-requests/completed
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate Case 01 cast expression assets"
          git push origin HEAD:main
