name: Materialize Livia layered rig

on:
  push:
    branches:
      - chatgpt/livia-layered-rig
    paths:
      - .github/workflows/materialize-livia-rig.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/livia-layered-rig
          fetch-depth: 0

      - name: Download and validate rig package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            'https://arquivo-morto.floot.app/_cdn/static/4c5c36a4-59f0-4152-a24f-d75817e59e6c-livia-rig-pack.zip' \
            -o /tmp/livia-rig.zip
          rm -rf public/characters/livia/rig
          mkdir -p public/characters/livia/rig
          unzip -o /tmp/livia-rig.zip -d public/characters/livia/rig
          test -f public/characters/livia/rig/manifest.json
          count="$(find public/characters/livia/rig -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "41"

      - name: Commit rig assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/characters/livia/rig
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Livia layered face rig assets"
          git push origin HEAD:chatgpt/livia-layered-rig
