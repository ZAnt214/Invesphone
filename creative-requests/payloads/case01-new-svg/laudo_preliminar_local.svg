<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280">
<rect width="900" height="1280" fill="#d8d1bb"/>
<rect x="45" y="35" width="810" height="1210" rx="5" fill="#f7f2df" stroke="#625b4d" stroke-width="2"/>
<text x="80" y="82" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#202020">DHPP</text>
<text x="80" y="112" font-family="Arial,sans-serif" font-size="17" fill="#555">HOMICÍDIOS</text>
<text x="790" y="96" text-anchor="end" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#e1dccb">DHPP</text>
<path d="M80 148H820" stroke="#444" stroke-width="2"/>
<text x="80" y="188" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#171717">LAUDO PRELIMINAR DE LOCAL</text>
<text x="80" y="224" font-family="Arial,sans-serif" font-size="16" fill="#625d52">CASO 01 · RUA DAS ACÁCIAS · CAMPO BELO</text>

<g font-family="Courier New,monospace" fill="#2d2b27">
 <text x="95" y="290" font-size="18" font-weight="700">OBJETO</text>
 <text x="95" y="325" font-size="17"><tspan x="95" dy="0">Exame preliminar do local, com registro do estado das</tspan><tspan x="95" dy="25">aberturas e dos ambientes acessíveis.</tspan></text>

 <text x="95" y="395" font-size="18" font-weight="700">ABERTURAS</text>
 <text x="95" y="430" font-size="17"><tspan x="95">Entrada principal sem sinais visíveis de arrombamento.</tspan><tspan x="95" dy="25">Fechadura e batente preservados no registro inicial.</tspan></text>

 <text x="95" y="500" font-size="18" font-weight="700">AMBIENTES</text>
 <text x="95" y="535" font-size="17"><tspan x="95">Sala com bens aparentes preservados. Escritório com</tspan><tspan x="95" dy="25">desorganização seletiva. Circulação interna sem</tspan><tspan x="95" dy="25">alteração relevante aparente.</tspan></text>

 <text x="95" y="640" font-size="18" font-weight="700">CANIL</text>
 <text x="95" y="675" font-size="17"><tspan x="95">Canil fechado pelo lado externo no registro inicial.</tspan><tspan x="95" dy="25">Thor localizado no interior.</tspan></text>

 <text x="95" y="750" font-size="18" font-weight="700">VESTÍGIOS REGISTRADOS</text>
 <text x="95" y="785" font-size="17"><tspan x="95">Fotografias periciais, estado das aberturas, áreas</tspan><tspan x="95" dy="25">reviradas e condições gerais do local.</tspan><tspan x="95" dy="25">Outros exames: A APURAR.</tspan></text>

 <text x="95" y="890" font-size="18" font-weight="700">CONCLUSÃO PRELIMINAR</text>
 <text x="95" y="925" font-size="17"><tspan x="95">Este documento descreve o estado observado do local e</tspan><tspan x="95" dy="25">não atribui autoria nem participação a qualquer pessoa.</tspan></text>
 <text x="95" y="1085" font-size="16">Perito: Maurício Farias</text>
</g>
<path d="M80 1170H820" stroke="#a79f8c"/>
