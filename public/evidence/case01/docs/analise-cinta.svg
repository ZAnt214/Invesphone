<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300"><rect width="1000" height="1300" fill="#d7d4ca"/><rect x="65" y="50" width="870" height="1190" fill="#faf8ef" stroke="#444"/><g font-family="Arial,sans-serif" fill="#202020"><text x="105" y="115" font-size="28" font-weight="700">DHPP · NÚCLEO DE INTELIGÊNCIA</text><text x="105" y="155" font-size="18">NOTA DE CRUZAMENTO FINANCEIRO · CASO 01</text><path d="M105 195H895" stroke="#333"/><text x="105" y="255" font-size="21" font-weight="700">OBJETO EXAMINADO</text><text x="105" y="295" font-size="19">Cinta bancária encontrada junto a quantia em dólares.</text><text x="105" y="365" font-size="21" font-weight="700">DADOS DA CINTA</text><text x="125" y="405" font-size="19">Banco Meridional</text><text x="125" y="440" font-size="19">Agência 0431</text><text x="125" y="475" font-size="19">Data 15/10/2002</text><text x="125" y="510" font-size="19">Valor US$ 5.000,00</text><text x="105" y="585" font-size="21" font-weight="700">CORRESPONDÊNCIA</text><rect x="105" y="615" width="790" height="150" fill="#e2ded0"/><text x="130" y="660" font-size="19">Extrato de Ricardo Valença registra retirada de câmbio</text><text x="130" y="697" font-size="19">em 15/10/2002, agência 0431, valor de US$ 5.000.</text><text x="130" y="734" font-size="19" font-weight="700">Correspondência nos quatro campos: POSITIVA.</text><text x="105" y="835" font-size="21" font-weight="700">INFORMAÇÃO DE CAMPO</text><text x="105" y="875" font-size="19">A quantia foi relacionada a Téo Duarte durante o levantamento.</text><text x="105" y="910" font-size="19">A relação não estabelece, isoladamente, participação no crime.</text><text x="105" y="1025" font-size="17">Responsável: Renata Leal · Investigação</text><text x="105" y="1060" font-size="17">Emitido: 17/10/2002 · 06:26</text></g><text x="40" y="1270" font-family="Arial" font-size="18">ARQUIVO FICCIONAL · CASO 01</text></svg>