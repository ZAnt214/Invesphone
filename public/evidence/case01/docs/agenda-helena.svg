<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300"><rect width="1000" height="1300" fill="#6f6250"/><rect x="100" y="65" width="800" height="1165" rx="14" fill="#efe6ce"/><line x1="500" y1="85" x2="500" y2="1210" stroke="#c6b996" stroke-width="4"/><g font-family="Georgia,serif" fill="#3c342a"><text x="150" y="150" font-size="30" font-weight="700">OUTUBRO · 2002</text><text x="150" y="235" font-size="21" font-style="italic">14/10 — Lívia discutiu de novo com o pai.</text><text x="150" y="285" font-size="21" font-style="italic">Ricardo falou em cortar ajuda se ela continuar</text><text x="150" y="320" font-size="21" font-style="italic">com Caio. Ela saiu batendo a porta.</text><text x="150" y="420" font-size="21" font-style="italic">15/10 — Ricardo foi ao banco cedo.</text><text x="150" y="470" font-size="21" font-style="italic">Disse que precisava resolver os dólares.</text><text x="150" y="570" font-size="21" font-style="italic">16/10 — Lívia perguntou outra vez como ficaria</text><text x="150" y="605" font-size="21" font-style="italic">o inventário se alguma coisa acontecesse.</text><text x="150" y="705" font-size="21" font-style="italic">Não gostei da pergunta.</text><text x="150" y="830" font-size="18">H.</text></g><text x="40" y="1270" font-family="Arial" font-size="18" fill="#eee">APREENDIDO NA RESIDÊNCIA · ARQUIVO FICCIONAL · CASO 01</text></svg>